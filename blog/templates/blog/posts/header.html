<header class="bg-info py-5 text-center">
    <div class="container">
        <h1 class="fs-4 font-bold">
            お知らせ一覧
        </h1>
        <search class="mt-4 row justify-content-center">
            <div class="col-auto dropdown">
                <button class="btn btn-secondary dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >事業所選択</button>
                <ul class="dropdown-menu">
                    <li>
                        <a class="dropdown-item{% if request.GET.category is None %} active{% endif %}"
                            href="{% url 'home' %}"
                        >すべて</a>
                    </li>
                    {% for category in categories %}
                        <li>
                            <a class="dropdown-item{% if request.GET.category is category.id|stringformat:'s' %} active{% endif %}"
                                href="{% url 'home' %}{% querystring category=category.id page=None %}"
                            >{{ category.name }}</a>
                        </li>
                    {% endfor %}
                </ul>
            </div>

            <form class="col-auto" action="{% url 'home' %}">
                <div class="input-group">
                    <span class="input-group-text">
                        {% include 'icons/search.html' %}
                    </span>
                    <input type="search"
                        class="form-control"
                        name="search"
                        value="{{ request.GET.search }}"
                        placeholder="検索"
                    >
                </div>
            </form>
        </search>
    </div>
</header>
